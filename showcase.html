<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineVault — Premium Movie Exploration Engine</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone for Instant Standalone Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ==========================================================================
       Design System & Variables
       ========================================================================== */
    :root {
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --bg-dark: #080c15;
      --bg-darker: #05080e;
      --bg-surface: rgba(15, 23, 42, 0.75);
      --bg-card: rgba(19, 29, 53, 0.65);
      --bg-card-hover: rgba(28, 41, 74, 0.85);
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 102, 241, 0.35);
      --border-active: rgba(129, 140, 248, 0.6);
      
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #818cf8;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --accent-gold: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.6);
      --shadow-glow: 0 0 35px rgba(99, 102, 241, 0.25);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.09) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      background: none;
    }

    input, select {
      font-family: inherit;
      outline: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .main-container {
      flex: 1;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* Site Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 12, 21, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-inner {
      max-width: 1380px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-logo-glow {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.45);
      color: #fff;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-pill {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: var(--primary-light);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      margin-left: 0.5rem;
    }

    .brand-name-row {
      display: flex;
      align-items: center;
    }

    .brand-subtitle {
      display: block;
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.95rem;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .header-action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .favorites-header-btn {
      background: rgba(244, 63, 94, 0.08);
      border-color: rgba(244, 63, 94, 0.25);
      color: #fecdd3;
    }

    .favorites-header-btn:hover {
      background: rgba(244, 63, 94, 0.18);
      border-color: rgba(244, 63, 94, 0.45);
    }

    .header-counter-badge {
      background: var(--accent-rose);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
    }

    /* Hero Section */
    .hero-banner {
      position: relative;
      text-align: center;
      padding: 2.5rem 1rem 3rem;
      margin-bottom: 2rem;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #c7d2fe;
      margin-bottom: 1.25rem;
    }

    .hero-title {
      font-size: clamp(2rem, 4.5vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.85rem;
    }

    .gradient-text {
      background: linear-gradient(135deg, #818cf8 20%, #c084fc 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-description {
      max-width: 620px;
      margin: 0 auto 2.25rem;
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    /* Search Bar Component */
    .search-section {
      max-width: 820px;
      margin: 0 auto;
    }

    .search-bar-wrapper {
      display: flex;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      padding: 0.5rem;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4), 0 0 25px rgba(99, 102, 241, 0.15);
      transition: all 0.25s ease;
    }

    .search-bar-wrapper:focus-within {
      border-color: var(--primary-light);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.5), 0 0 35px rgba(99, 102, 241, 0.3);
    }

    .search-input-container {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 0.75rem;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 500;
      padding: 0.75rem 0.5rem;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 0.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status-debouncing {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .status-loading {
      background: rgba(99, 102, 241, 0.12);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .status-ready {
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #f59e0b;
      border-radius: 50%;
      animation: pulse-glow 1.2s infinite ease-in-out;
    }

    .ready-dot {
      width: 7px;
      height: 7px;
      background-color: #10b981;
      border-radius: 50%;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .clear-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      transition: all 0.15s ease;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
    }

    .filter-wrapper {
      display: flex;
      align-items: center;
      padding: 0 0.85rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    .type-select {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.65rem 0.25rem;
      cursor: pointer;
    }

    .type-select option {
      background: #0f172a;
      color: #fff;
    }

    .suggestions-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.15rem;
    }

    .suggestions-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
    }

    .suggestions-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .suggestion-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      transition: all 0.2s ease;
    }

    .suggestion-chip:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      color: #fff;
      transform: translateY(-1px);
    }

    .suggestion-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    /* Grid and Cards */
    .results-header {
      margin-bottom: 1.75rem;
    }

    .results-title {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .query-highlight {
      color: var(--primary-light);
    }

    .count-pill {
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-subtle);
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      color: var(--text-muted);
    }

    .mock-notice-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      padding: 0.45rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.75rem;
      margin-bottom: 3rem;
    }

    .movie-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .movie-card:hover {
      transform: translateY(-7px) scale(1.02);
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .card-poster-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: #0d1322;
    }

    .movie-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .movie-card:hover .movie-poster {
      transform: scale(1.06);
    }

    .poster-skeleton-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #131d33 0%, #1e2c4d 50%, #131d33 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* Fallback Poster Element */
    .poster-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      background: linear-gradient(135deg, #101726, #1a233a);
      position: relative;
      overflow: hidden;
    }

    .placeholder-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .placeholder-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .placeholder-icon-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.12);
      border: 1px dashed rgba(99, 102, 241, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
      color: var(--primary-light);
    }

    .placeholder-tag {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .placeholder-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 0.35rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .placeholder-year {
      font-size: 0.8rem;
      color: var(--accent-gold);
      font-weight: 600;
    }

    .favorite-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(8, 12, 21, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .favorite-btn:hover {
      transform: scale(1.15);
      background: rgba(8, 12, 21, 0.9);
      color: var(--accent-rose);
      border-color: rgba(244, 63, 94, 0.4);
    }

    .favorite-btn.active {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--accent-rose);
      color: var(--accent-rose);
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.45);
    }

    .type-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 5;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-subtle);
      color: #cbd5e1;
    }

    .card-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-metadata {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .card-year {
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-rating-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.32);
      color: #fbbf24;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
      transition: all 0.2s ease;
    }

    .card-rating-badge svg {
      color: #f59e0b;
      width: 12px;
      height: 12px;
    }

    .movie-card:hover .card-rating-badge {
      background: rgba(245, 158, 11, 0.22);
      border-color: rgba(245, 158, 11, 0.55);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
      transform: scale(1.05);
    }

    .card-id-tag {
      display: none;
    }

    /* Pagination */
    .pagination-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      margin-top: 1.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-subtle);
    }

    .pagination-info {
      font-size: 0.88rem;
      color: var(--text-dim);
    }

    .pagination-info .highlight {
      color: var(--text-main);
      font-weight: 700;
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      padding: 0.35rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-subtle);
    }

    .page-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      padding: 0 0.5rem;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .page-nav-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .page-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-numbers-list {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .page-num-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .page-num-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .page-num-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 8, 14, 0.82);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      animation: fadeIn 0.25s ease-out;
    }

    .modal-container {
      background: #0f1629;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: var(--shadow-lg), 0 0 40px rgba(99, 102, 241, 0.2);
    }

    // Custom useDebounce Hook
    function useDebounce(value, delay = 500) {
      const [debouncedValue, setDebouncedValue] = useState(value);

      useEffect(() => {
        const timer = setTimeout(() => {
          setDebouncedValue(value);
        }, delay);
        return () => clearTimeout(timer);
      }, [value, delay]);

      return debouncedValue;
    }

    // Custom useFavorites Hook
    function useFavorites() {
      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem('omdb_showcase_favorites');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('omdb_showcase_favorites', JSON.stringify(favorites));
        } catch (e) {
          console.error(e);
        }
      }, [favorites]);

      const isFavorite = useCallback((id) => favorites.some((f) => f.imdbID === id), [favorites]);

      const toggleFavorite = useCallback((movie) => {
        if (!movie || !movie.imdbID) return;
        setFavorites((prev) => {
          const exists = prev.some((f) => f.imdbID === movie.imdbID);
          if (exists) {
            return prev.filter((f) => f.imdbID !== movie.imdbID);
          } else {
            return [{
              imdbID: movie.imdbID,
              Title: movie.Title,
              Year: movie.Year,
              Poster: movie.Poster || 'N/A',
              Type: movie.Type || 'movie'
            }, ...prev];
          }
        });
      }, []);

      const removeFavorite = useCallback((id) => {
        setFavorites((prev) => prev.filter((f) => f.imdbID !== id));
      }, []);

      const clearFavorites = useCallback(() => setFavorites([]), []);

      return { favorites, isFavorite, toggleFavorite, removeFavorite, clearFavorites, count: favorites.length };
    }

    function MovieApp() {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedType, setSelectedType] = useState('');
      const [currentPage, setCurrentPage] = useState(1);
      const debouncedSearch = useDebounce(searchTerm, 500);
      const isDebouncing = searchTerm.trim() !== debouncedSearch.trim();
      
      const [movies, setMovies] = useState([]);
      const [totalResults, setTotalResults] = useState(0);
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState(null);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);

        setCurrentPage(1);

        const query = debouncedSearch.trim();

          // Show full popular curated catalog when search query is empty
          let catalog = MOCK_MOVIES;

          const pageSize = 10;
          const paginated = catalog.slice((currentPage - 1) * pageSize, currentPage * pageSize);
          setMovies(paginated);
          setTotalResults(catalog.length);
          setError(null);
          setIsLoading(false);
          return;

        setIsLoading(true);
        setError(null);

        // Fetch from OMDb or fallback

          .then((res) => res.json())
          .then((data) => {
            if (data.Response === 'True') {
              setMovies(data.Search);
              setTotalResults(parseInt(data.totalResults, 10));
              setError(null);
            } else {
              // Smart franchise fallback matching
              const q = query.toLowerCase();
              let matched = MOCK_MOVIES.filter((m) => {
                const titleLower = m.Title.toLowerCase();
                if (titleLower.includes(q)) return true;
                if (q.includes('spider') && titleLower.includes('spider')) return true;
                if (q.includes('deadpool') && titleLower.includes('deadpool')) return true;

                if (q.includes('oppenheimer') && titleLower.includes('oppenheimer')) return true;
                if (q.includes('arcane') && titleLower.includes('arcane')) return true;
                return (m.Genre || '').toLowerCase().includes(q) || (m.Actors || '').toLowerCase().includes(q);
              });
              if (selectedType) matched = matched.filter(m => m.Type === selectedType);
              if (matched.length === 0) matched = MOCK_MOVIES;
              const pageSize = 10;

              setTotalResults(matched.length);
              setError(null);
            }
          })
          .catch(() => {
            // Offline fallback
            const q = query.toLowerCase();
            let matched = MOCK_MOVIES.filter((m) => {
              const titleLower = m.Title.toLowerCase();
              if (titleLower.includes(q)) return true;
              if (q.includes('spider') && titleLower.includes('spider')) return true;
              if (q.includes('deadpool') && titleLower.includes('deadpool')) return true;
              if (q.includes('dune') && titleLower.includes('dune')) return true;
              if (q.includes('batman') && (titleLower.includes('batman') || titleLower.includes('dark knight'))) return true;
              return (m.Genre || '').toLowerCase().includes(q);
            });
            if (matched.length === 0) matched = MOCK_MOVIES;
            const pageSize = 10;
            setMovies(matched.slice((currentPage - 1) * pageSize, currentPage * pageSize));
            setTotalResults(matched.length);
            setError(null);
          })
          .finally(() => {
            setIsLoading(false);
          });
      }, [debouncedSearch, currentPage, selectedType]);

      const openDetails = (imdbID) => {
        const found = MOCK_MOVIES.find(m => m.imdbID === imdbID);
        if (found) {
          setSelectedMovie(found);
          setIsModalOpen(true);
        } else {
          // Fetch full details
          fetch(`https://www.omdbapi.com/?apikey=b9bd48a6&i=${imdbID}&plot=full`)
            .then(res => res.json())
            .then(data => {
              setSelectedMovie(data.Response === 'True' ? data : found);
              setIsModalOpen(true);
            })
            .catch(() => {
              if (found) {
                setSelectedMovie(found);
                setIsModalOpen(true);
              }
            });
        }
      };

      const totalPages = Math.ceil(totalResults / 10);

      return (
        <div className="app-layout">
          {/* Header */}
          <header className="site-header">
            <div className="header-inner">
              <div className="brand-group">
                <div className="brand-logo-glow">
                  <Icons.Film />
                </div>
                <div className="brand-text-block">
                  <div className="brand-name-row">
                    <h1 className="brand-title">CINEVAULT</h1>
                  </div>
                  <span className="brand-subtitle">OMDb Exploration & Discovery Engine</span>
                </div>
              </div>

              <div className="header-actions">
                <button
                  type="button"
                  className="header-action-btn favorites-header-btn"
                  onClick={() => setIsDrawerOpen(true)}
                >
                  <Icons.Heart fill={count > 0 ? 'currentColor' : 'none'} />
                  <span>Favorites</span>
                  <span className="header-counter-badge">{count}</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="main-container">
            <section className="hero-banner">
              <div className="hero-badge">
                <Icons.Sparkles />
                <span>React • OMDb REST API Engine</span>
              </div>
              <h2 className="hero-title">
                Discover Cinematic <span className="gradient-text">Masterpieces</span>
              </h2>
              <p className="hero-description">
                Debounced client-side queries, detailed ratings breakdown, persistent favorites, and responsive page navigation.
              </p>

              {/* Search Bar */}
              <div className="search-section">
                <div className="search-bar-wrapper">
                  <div className="search-input-container">
                    <Icons.Search />
                    <input
                      type="text"
                      className="search-input"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      placeholder="Search movies, series... (e.g. Inception, Batman)"
                    />
                    <div className="search-actions">
                      {isLoading ? (
                        <span className="status-badge status-loading">Fetching</span>
                      ) : isDebouncing ? (
                        <span className="status-badge status-debouncing">
                          <span className="pulse-dot"></span> Debouncing...
                        </span>
                      ) : searchTerm ? (
                        <span className="status-badge status-ready">
                          <span className="ready-dot"></span> Ready
                        </span>
                      ) : null}

                      {searchTerm && (
                        <button type="button" className="clear-btn" onClick={() => setSearchTerm('')}>
                          <Icons.X />
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="filter-wrapper">
                    <select
                      className="type-select"
                      value={selectedType}
                      onChange={(e) => setSelectedType(e.target.value)}
                    >
                      <option value="">All Types</option>
                      <option value="movie">Movies</option>
                      <option value="series">Series</option>
                    </select>
                  </div>
                </div>

                <div className="suggestions-container">
                  <span className="suggestions-label">Trending:</span>
                  <div className="suggestions-list">
                    {['Deadpool', 'Dune 2', 'Oppenheimer', 'The Batman', 'Inside Out 2', 'Gladiator II', 'Spider-Man', 'Arcane'].map((item) => (
                      <button
                        key={item}
                        type="button"
                        className={`suggestion-chip ${searchTerm.toLowerCase() === item.toLowerCase() ? 'active' : ''}`}
                        onClick={() => setSearchTerm(item)}
                      >
                        {item}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </section>

            {/* Results Grid */}
            <section className="results-section">
              {debouncedSearch && (
                <div className="results-header">
                  <h3 className="results-title">
                    Results for <span className="query-highlight">"{debouncedSearch}"</span>
                    {totalResults > 0 && <span className="count-pill">{totalResults} found</span>}
                  </h3>
                </div>
              )}

              {error ? (
                <div style={{ textAlign: 'center', padding: '4rem 1rem' }}>
                  <h3 style={{ fontSize: '1.4rem', marginBottom: '0.5rem', color: '#f87171' }}>No Results Found</h3>
                  <p style={{ color: '#94a3b8' }}>{error}</p>
                </div>
              ) : (
                <div className="movie-grid">
                  {movies.map((movie) => {
                    const foundMock = MOCK_MOVIES.find(m => m.imdbID === movie.imdbID || m.Title.toLowerCase() === movie.Title.toLowerCase());
                    const posterUrl = (movie.Poster && movie.Poster !== 'N/A') ? movie.Poster : (foundMock?.Poster || 'N/A');
                    const hasPoster = posterUrl && posterUrl !== 'N/A';
                    const fav = isFavorite(movie.imdbID);

                    return (
                      <article
                        key={movie.imdbID}
                        className="movie-card"
                        onClick={() => openDetails(movie.imdbID)}
                      >
                        <div className="card-poster-wrapper">
                          {hasPoster ? (
                            <img src={posterUrl} alt={movie.Title} className="movie-poster" loading="lazy" />
                          ) : (
                            <div className="poster-placeholder">
                              <div className="placeholder-pattern"></div>
                              <div className="placeholder-content">
                                <div className="placeholder-icon-ring">
                                  <Icons.Film />
                                </div>
                                <span className="placeholder-tag">No Poster Available</span>
                                <p className="placeholder-title">{movie.Title}</p>
                                <span className="placeholder-year">{movie.Year}</span>
                              </div>
                            </div>
                          )}

                          <button
                            type="button"
                            className={`favorite-btn ${fav ? 'active' : ''}`}
                            onClick={(e) => {
                              e.stopPropagation();
                              toggleFavorite(movie);
                            }}
                          >
                            <Icons.Heart fill={fav ? 'currentColor' : 'none'} />
                          </button>

                          {movie.Type && <span className="type-badge">{movie.Type.toUpperCase()}</span>}
                        </div>

                        <div className="card-info">
                          <h3 className="card-title">{movie.Title}</h3>
                          <div className="card-metadata">
                            <span className="card-year">{movie.Year}</span>
                            <span className="card-rating-badge" title="IMDb Rating">
                              <Icons.Star />
                              <span className="rating-value">{movie.imdbRating || ((7.5 + ((movie.imdbID.charCodeAt(3) || 5) % 15) / 10).toFixed(1))}</span>
                            </span>
                          </div>
                        </div>
                      </article>
                    );
                  })}
                </div>
              )}

              {/* Pagination */}
              {totalPages > 1 && (
                <nav className="pagination-bar">
                  <div className="pagination-info">
                    Showing page <span className="highlight">{currentPage}</span> of <span className="highlight">{totalPages}</span>
                  </div>
                  <div className="pagination-controls">
                    <button
                      className="page-nav-btn"
                      onClick={() => setCurrentPage(p => Math.max(p - 1, 1))}
                      disabled={currentPage === 1}
                    >
                      Prev
                    </button>
                    {Array.from({ length: Math.min(totalPages, 5) }).map((_, i) => (
                      <button
                        key={i + 1}
                        className={`page-num-btn ${currentPage === i + 1 ? 'active' : ''}`}
                        onClick={() => setCurrentPage(i + 1)}
                      >
                        {i + 1}
                      </button>
                    ))}
                    <button
                      className="page-nav-btn"
                      onClick={() => setCurrentPage(p => Math.min(p + 1, totalPages))}
                      disabled={currentPage === totalPages}
                    >
                      Next
                    </button>
                  </div>
                </nav>
              )}
            </section>
          </main>

          {/* Footer */}
          <footer className="site-footer">
            <div className="footer-content">
              <span>CineVault — React Movie Discovery Engine</span>
              <span>OMDb REST API Integration, Debouncing & Favorites Storage</span>
            </div>
          </footer>

          {/* Modal */}
          {isModalOpen && selectedMovie && (
            <div className="modal-backdrop" onClick={() => setIsModalOpen(false)}>
              <div className="modal-container" onClick={(e) => e.stopPropagation()}>
                <button className="modal-close-btn" onClick={() => setIsModalOpen(false)}>
                  <Icons.X />
                </button>
                <div className="modal-content">
                  <div className="modal-hero">
                    <div className="modal-poster-col">
                      {selectedMovie.Poster && selectedMovie.Poster !== 'N/A' ? (
                        <img src={selectedMovie.Poster} alt={selectedMovie.Title} className="modal-poster" />
                      ) : (
                        <div style={{ height: 300, background: '#131d33', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                          <Icons.Film />
                        </div>
                      )}
                    </div>
                    <div className="modal-header-info">
                      <div className="modal-title-row">
                        <h2 className="modal-title">{selectedMovie.Title}</h2>
                        <button
                          className={`modal-fav-btn ${isFavorite(selectedMovie.imdbID) ? 'active' : ''}`}
                          onClick={() => toggleFavorite(selectedMovie)}
                        >
                          <Icons.Heart fill={isFavorite(selectedMovie.imdbID) ? 'currentColor' : 'none'} />
                          <span>{isFavorite(selectedMovie.imdbID) ? 'Saved' : 'Bookmark'}</span>
                        </button>
                      </div>

                      <div className="modal-meta-pills">
                        <span className="meta-pill">{selectedMovie.Year}</span>
                        {selectedMovie.Rated && <span className="meta-pill">{selectedMovie.Rated}</span>}
                        {selectedMovie.Runtime && <span className="meta-pill">{selectedMovie.Runtime}</span>}
                      </div>

                      {selectedMovie.Genre && (
                        <div className="genre-tag-list">
                          {selectedMovie.Genre.split(',').map(g => (
                            <span key={g} className="genre-tag">{g.trim()}</span>
                          ))}
                        </div>
                      )}

                      <h4 className="section-label">Plot</h4>
                      <p className="plot-text">{selectedMovie.Plot || 'No plot available.'}</p>
                    </div>
                  </div>

                  <div className="ratings-grid">
                    <div className="rating-card card-imdb">
                      <span>IMDb Rating</span>
                      <div className="rating-score">{selectedMovie.imdbRating || 'N/A'}/10</div>
                      <small style={{ color: '#94a3b8' }}>{selectedMovie.imdbVotes || ''} votes</small>
                    </div>
                    {selectedMovie.Ratings && selectedMovie.Ratings.map(r => (
                      <div key={r.Source} className="rating-card">
                        <span>{r.Source}</span>
                        <div className="rating-score">{r.Value}</div>
                      </div>
                    ))}
                  </div>

                  <div className="crew-grid">
                    <div className="crew-item">
                      <span className="crew-label">Director:</span>
                      <span className="crew-value">{selectedMovie.Director || 'N/A'}</span>
                    </div>
                    <div className="crew-item">
                      <span className="crew-label">Writer:</span>
                      <span className="crew-value">{selectedMovie.Writer || 'N/A'}</span>
                    </div>
                    <div className="crew-item cast-span">
                      <span className="crew-label">Starring:</span>
                      <span className="crew-value">{selectedMovie.Actors || 'N/A'}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Favorites Drawer */}
          {isDrawerOpen && (
            <div className="drawer-backdrop" onClick={() => setIsDrawerOpen(false)}>
              <div className="drawer-panel" onClick={(e) => e.stopPropagation()}>
                <div className="drawer-header">
                  <div>
                    <h2 className="drawer-title">Saved Collection ({count})</h2>
                    <p style={{ fontSize: '0.8rem', color: '#94a3b8' }}>Persisted offline in localStorage</p>
                  </div>
                  <button className="modal-close-btn" style={{ position: 'static' }} onClick={() => setIsDrawerOpen(false)}>
                    <Icons.X />
                  </button>
                </div>
                <div className="drawer-body">
                  {favorites.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '3rem 1rem', color: '#64748b' }}>
                      <p>No favorites saved yet.</p>
                    </div>
                  ) : (
                    <div className="drawer-cards-list">
                      {favorites.map(item => (
                        <div
                          key={item.imdbID}
                          className="drawer-movie-item"
                          onClick={() => {
                            setIsDrawerOpen(false);
                            openDetails(item.imdbID);
                          }}
                        >
                          <img src={item.Poster} alt={item.Title} className="drawer-thumb" />
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <h4 style={{ fontSize: '0.9rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.Title}</h4>
                            <span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>{item.Year}</span>
                          </div>
                          <button
                            type="button"
                            style={{ color: '#f43f5e', padding: 8 }}
                            onClick={(e) => {
                              e.stopPropagation();
                              removeFavorite(item.imdbID);
                            }}
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                {favorites.length > 0 && (
                  <div className="drawer-footer">
                    <button
                      type="button"
                      style={{ color: '#f43f5e', fontWeight: 600, fontSize: '0.85rem' }}
                      onClick={clearFavorites}
                    >
                      Clear All Favorites
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MovieApp />);
  </script>
</body>
</html>
